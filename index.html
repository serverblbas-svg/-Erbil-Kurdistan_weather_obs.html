<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کەشوهەوای هەولێر</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    font-family: "NRT Bold", Arial, sans-serif;
    overflow: hidden;
}

.weather-widget-container {
    position: fixed;
    top: 50px;
    left: 70px;
    z-index: 9999;
}

.weather-circle {
    width: 250px;
    height: 250px;
    border: 2px solid #38bdf8;
    border-radius: 50%;
    background: linear-gradient(
        145deg,
        rgba(1, 1, 14, 0.98),
        rgba(1, 20, 42, 0.98)
    );
    box-shadow:
        0 0 18px rgba(56, 189, 248, 0.25),
        0 6px 18px rgba(0, 0, 0, 0.7);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 16px;
    gap: 4px;
}

.city {
    font-size: 23px;
    font-weight: bold;
    white-space: nowrap;
}

.weather-icon {
    font-size: 38px;
    line-height: 1.15;
}

.temp {
    font-size: 34px;
    font-weight: bold;
    line-height: 1.1;
    direction: ltr;
}

.condition {
    font-size: 18px;
    color: #e2e8f0;
    white-space: nowrap;
}

.extra-info {
    width: 88%;
    margin-top: 5px;
    padding-top: 6px;
    border-top: 1px solid rgba(255,255,255,0.22);
    color: #7dd3fc;
    font-size: 13px;
    line-height: 1.7;
}

.status {
    font-size: 10px;
    color: #94a3b8;
    margin-top: 1px;
}

@media (max-width: 400px) {
    .weather-widget-container {
        top: 15px;
        left: 15px;
    }
}
</style>
</head>

<body>
<div class="weather-widget-container">
    <div class="weather-circle">
        <div class="city">📍 هەولێر</div>
        <div class="weather-icon" id="weather-icon">🌤️</div>
        <div class="temp" id="temp-val">--°C</div>
        <div class="condition" id="cond-text">بارکردنی داتا...</div>
        <div class="extra-info" id="extra-text">
            شێ: --٪ | با: -- کم/ک
        </div>
        <div class="status" id="status-text">پەیوەندی بە کەشوهەواوە...</div>
    </div>
</div>

<script>
const API_URL =
    "https://api.open-meteo.com/v1/forecast" +
    "?latitude=36.1911" +
    "&longitude=44.0092" +
    "¤t=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,is_day" +
    "&timezone=Asia%2FBaghdad";

const kurdishDigits = value =>
    String(value).replace(/[0-9]/g, digit =>
        "٠١٢٣٤٥٦٧٨٩"[Number(digit)]
    );

function getWeatherDescription(code) {
    const descriptions = {
        0: ["☀️", "ئاسمان ڕوون"],
        1: ["🌤️", "زۆر کەم هەور"],
        2: ["⛅", "هەور بەشێوەیی"],
        3: ["☁️", "هەوراو"],
        45: ["🌫️", "تەمی"],
        48: ["🌫️", "تەمی بەستوو"],
        51: ["🌦️", "بارانی سووک"],
        53: ["🌦️", "بارانی مامناوەند"],
        55: ["🌧️", "بارانی بەهێز"],
        56: ["🌧️", "بارانی سارد"],
        57: ["🌧️", "بارانی ساردی بەهێز"],
        61: ["🌦️", "بارانی سووک"],
        63: ["🌧️", "باران"],
        65: ["🌧️", "بارانی بەهێز"],
        66: ["🌧️", "بارانی سەهۆڵی"],
        67: ["🌧️", "بارانی سەهۆڵی بەهێز"],
        71: ["🌨️", "بەفرێکی سووک"],
        73: ["🌨️", "بەفر"],
        75: ["❄️", "بەفرێکی بەهێز"],
        77: ["❄️", "وردەبەفر"],
        80: ["🌦️", "ڕشانەوەی باران"],
        81: ["🌧️", "ڕشانەوەی باران"],
        82: ["⛈️", "ڕشانەوەی بارانی بەهێز"],
        85: ["🌨️", "ڕشانەوەی بەفر"],
        86: ["❄️", "ڕشانەوەی بەفری بەهێز"],
        95: ["⛈️", "زریان"],
        96: ["⛈️", "زریان و تەگەرە"],
        99: ["⛈️", "زریان و تەگەرەی بەهێز"]
    };

    return descriptions[code] || ["🌡️", "کەشوهەوا"];
}

async function loadWeather() {
    const status = document.getElementById("status-text");

    try {
        status.textContent = "نوێکردنەوەی داتا...";

        const response = await fetch(API_URL, {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error("Weather API unavailable");
        }

        const data = await response.json();
        const current = data.current;

        if (!current) {
            throw new Error("No current weather data");
        }

        const temperature = Math.round(current.temperature_2m);
        const humidity = Math.round(current.relative_humidity_2m);
        const wind = Math.round(current.wind_speed_10m);
        const code = current.weather_code;
        const isDay = current.is_day === 1;

        const weather = getWeatherDescription(code);
        let emoji = weather[0];

        // نیشاندانی مانگ لە شەودا بۆ دۆخی ئاسمانی ڕوون
        if (!isDay && code === 0) {
            emoji = "🌙";
        } else if (!isDay && code === 1) {
            emoji = "🌙";
        }

        document.getElementById("temp-val").textContent =
            kurdishDigits(temperature) + "°C";

        document.getElementById("weather-icon").textContent = emoji;
        document.getElementById("cond-text").textContent = weather[1];

        document.getElementById("extra-text").textContent =
            "شێ: " + kurdishDigits(humidity) +
            "٪ | با: " + kurdishDigits(wind) + " کم/ک";

        const updatedAt = new Date();
        document.getElementById("status-text").textContent =
            "نوێکراوەتەوە: " +
            kurdishDigits(
                updatedAt.toLocaleTimeString("en-GB", {
                    timeZone: "Asia/Baghdad",
                    hour: "2-digit",
                    minute: "2-digit",
                    hour12: false
                })
            );

    } catch (error) {
        status.textContent =
            "پەیوەندی بەردەست نییە؛ دووبارە هەوڵ دەدرێت";
        console.error("Weather loading error:", error);
    }
}

// بارکردنی یەکەم داتا
loadWeather();

// نوێکردنەوەی خۆکار هەر ٥ خولەک جارێک
setInterval(loadWeather, 5 * 60 * 1000);
</script>
</body>
</html>
