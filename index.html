
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Erbil Weather</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 900;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
}

.weather-widget-container {
    position: fixed;
    top: 0;
    left: 70px;
    z-index: 9999;
}

.weather-circle {
    width: 250px;
    height: 250px;
    border: 3px solid #7dd3fc;
    border-radius: 50%;
    background: linear-gradient(
        145deg,
        #071b72 0%,
        #061344 55%,
        #02091f 100%
    );
    box-shadow:
        0 0 22px rgba(56, 189, 248, 0.48),
        0 0 40px rgba(0, 0, 0, 0.55),
        inset 0 0 20px rgba(56, 189, 248, 0.12);
    color: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 14px;
    gap: 4px;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.85);
}

.city {
    font-size: 20px;
    font-weight: 900;
    color: #ffffff;
    white-space: nowrap;
    text-shadow: 0 2px 5px #000000;
}

.weather-icon {
    font-size: 20px;
    line-height: 1.15;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.6));
}

.temp {
    font-size: 20px;
    font-weight: 900;
    line-height: 1.1;
    direction: ltr;
    color: #ffffff;
    text-shadow:
        0 2px 4px #000000,
        0 0 12px rgba(125, 211, 252, 0.4);
}

.condition {
    font-size: 20px;
    font-weight: 900;
    color: #ffffff;
    white-space: nowrap;
    text-shadow: 0 2px 4px #000000;
}

.extra-info {
    width: 100%;
    margin-top: 5px;
    padding-top: 6px;
    border-top: 2px solid rgba(125, 211, 252, 0.65);
    color: #ffffff;
    font-size: 20px;
    font-weight: 900;
    line-height: 1.7;
    text-shadow: 0 2px 4px #000000;
}

.status {
    font-size: 20px;
    font-weight: 900;
    color: #bae6fd;
    margin-top: 1px;
    text-shadow: 0 1px 3px #000000;
}

@media (max-width: 400px) {
    .weather-widget-container {
        top: 15px;
        left: 15px;
    }
}
</style>
</head>

<body>

<div class="weather-widget-container">
    <div class="weather-circle">
        <div class="city">📍 Erbil</div>
        <div class="weather-icon" id="weather-icon">🌤️</div>
        <div class="temp" id="temp-val">--°C</div>
        <div class="condition" id="cond-text">Loading weather...</div>
        <div class="extra-info" id="extra-text">
            Humidity: --% | Wind: -- km/h
        </div>
        <div class="status" id="status-text">Connecting to weather...</div>
    </div>
</div>

<script>
const API_URL =
    "https://api.open-meteo.com/v1/forecast" +
    "?latitude=36.1911" +
    "&longitude=44.0092" +
    "&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,is_day" +
    "&timezone=Asia%2FBaghdad";

function getWeatherDescription(code) {
    const descriptions = {
        0: ["☀️", "Clear Sky"],
        1: ["🌤️", "Mainly Clear"],
        2: ["⛅", "Partly Cloudy"],
        3: ["☁️", "Overcast"],
        45: ["🌫️", "Fog"],
        48: ["🌫️", "Depositing Rime Fog"],
        51: ["🌦️", "Light Drizzle"],
        53: ["🌦️", "Moderate Drizzle"],
        55: ["🌧️", "Dense Drizzle"],
        56: ["🌧️", "Light Freezing Drizzle"],
        57: ["🌧️", "Dense Freezing Drizzle"],
        61: ["🌦️", "Light Rain"],
        63: ["🌧️", "Moderate Rain"],
        65: ["🌧️", "Heavy Rain"],
        66: ["🌧️", "Light Freezing Rain"],
        67: ["🌧️", "Heavy Freezing Rain"],
        71: ["🌨️", "Light Snowfall"],
        73: ["🌨️", "Moderate Snowfall"],
        75: ["❄️", "Heavy Snowfall"],
        77: ["❄️", "Snow Grains"],
        80: ["🌦️", "Light Rain Showers"],
        81: ["🌧️", "Moderate Rain Showers"],
        82: ["⛈️", "Violent Rain Showers"],
        85: ["🌨️", "Light Snow Showers"],
        86: ["❄️", "Heavy Snow Showers"],
        95: ["⛈️", "Thunderstorm"],
        96: ["⛈️", "Thunderstorm with Hail"],
        99: ["⛈️", "Severe Thunderstorm with Hail"]
    };

    return descriptions[code] || ["🌡️", "Current Weather"];
}

async function loadWeather() {
    const status = document.getElementById("status-text");

    try {
        status.textContent = "Updating weather...";

        const response = await fetch(API_URL, {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error("Weather API unavailable");
        }

        const data = await response.json();
        const current = data.current;

        if (!current) {
            throw new Error("No current weather data");
        }

        const temperature = Math.round(current.temperature_2m);
        const humidity = Math.round(current.relative_humidity_2m);
        const wind = Math.round(current.wind_speed_10m);
        const code = current.weather_code;
        const isDay = current.is_day === 1;

        const weather = getWeatherDescription(code);
        let emoji = weather[0];

        if (!isDay && (code === 0 || code === 1)) {
            emoji = "🌙";
        }

        document.getElementById("temp-val").textContent =
            temperature + "°C";

        document.getElementById("weather-icon").textContent = emoji;
        document.getElementById("cond-text").textContent = weather[1];

        document.getElementById("extra-text").textContent =
            "Humidity: " + humidity +
            "% | Wind: " + wind + " km/h";

        const updatedAt = new Date();

        document.getElementById("status-text").textContent =
            "Updated: " +
            updatedAt.toLocaleTimeString("en-GB", {
                timeZone: "Asia/Baghdad",
                hour: "2-digit",
                minute: "2-digit",
                hour12: false
            });

    } catch (error) {
        status.textContent = "Weather unavailable - retrying...";
        console.error("Weather loading error:", error);
    }
}

// Load weather immediately
loadWeather();

// Automatically refresh every 5 minutes
setInterval(loadWeather, 5 * 60 * 1000);
</script>

</body>
</html>
