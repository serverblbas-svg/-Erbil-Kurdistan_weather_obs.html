<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>کەشوهەوای هەولێر - شاشە</title>
    <style>
        body {
            margin: 0;
            background-color: transparent; /* بۆ ئەوەی لەسەر باکگراوندێکی تر دەربکەوێت */
            font-family: 'NRT Bold', Arial, sans-serif;
            color: #ffffff;
        }
        .weather-circle {
            width: 320px;
            height: 320px;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.75), rgba(30, 41, 59, 0.85));
            border: 4px solid #38bdf8;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            padding: 20px;
            box-sizing: border-box;
        }
        .city {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #38bdf8;
        }
        .icon {
            font-size: 64px;
            margin: 10px 0;
        }
        .temp {
            font-size: 42px;
            font-weight: bold;
        }
        .condition {
            font-size: 18px;
            color: #cbd5e1;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="weather-circle">
        <div class="city">📍 هەولێر</div>
        <div class="icon" id="weather-icon">☀️</div>
        <div class="temp" id="temp-val">٢٨°C</div>
        <div class="condition" id="cond-text">ساماڵ و خۆرەتاو</div>
    </div>

</body>
</html>
