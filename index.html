
<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کەشوهەوای هەولێر</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    font-family: "NRT Bold", "Noto Sans Arabic", Arial, sans-serif;
    font-weight: 900;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
}

.weather-widget-container {
    position: fixed;
    top: 0px;
    left: 70px;
    z-index: 9999;
}

.weather-circle {
    width: 250px;
    height: 250px;
    border: 3px solid #7dd3fc;
    border-radius: 50%;
    background: linear-gradient(
        145deg,
        #071b72 0%,
        #061344 55%,
        #02091f 100%
    );
    box-shadow:
        0 0 22px rgba(56, 189, 248, 0.48),
        0 0 40px rgba(0, 0, 0, 0.55),
        inset 0 0 20px rgba(56, 189, 248, 0.12);
    color: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 14px;
    gap: 4px;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.85);
}

.city {
    font-size: 20px;
    font-weight: 900;
    color: #ffffff;
    white-space: nowrap;
    text-shadow: 0 2px 5px #000000;
}

.weather-icon {
    font-size: 20px;
    line-height: 1.15;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.6));
}

.temp {
    font-size: 20px;
    font-weight: 900;
    line-height: 1.1;
    direction: ltr;
    color: #ffffff;
    text-shadow:
        0 2px 4px #000000,
        0 0 12px rgba(125, 211, 252, 0.4);
}

.condition {
    font-size: 20px;
    font-weight: 900;
    color: #ffffff;
    white-space: nowrap;
    text-shadow: 0 2px 4px #000000;
}

.extra-info {
    width: 94%;
    margin-top: 5px;
    padding-top: 6px;
    border-top: 2px solid rgba(125, 211, 252, 0.65);
    color: #ffffff;
    font-size: 20px;
    font-weight: 900;
    line-height: 1.7;
    text-shadow: 0 2px 4px #000000;
}

.status {
    font-size: 20px;
    font-weight: 900;
    color: #bae6fd;
    margin-top: 1px;
    text-shadow: 0 1px 3px #000000;
}

@media (max-width: 400px) {
    .weather-widget-container {
        top: 15px;
        left: 15px;
    }
}

</style>
</head>

<body>
<div class="weather-widget-container">
    <div class="weather-circle">
        <div class="city">📍 هەولێر</div>
        <div class="weather-icon" id="weather-icon">🌤️</div>
        <div class="temp" id="temp-val">--°C</div>
        <div class="condition" id="cond-text">بارکردنی داتا...</div>
        <div class="extra-info" id="extra-text">
            شێ: --٪ | با: -- کم/ک
        </div>
        <div class="status" id="status-text">پەیوەندی بە کەشوهەواوە...</div>
    </div>
</div>

<script>
const API_URL =
    "https://api.open-meteo.com/v1/forecast" +
    "?latitude=36.1911" +
    "&longitude=44.0092" +
    "&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,is_day" +
    "&timezone=Asia%2FBaghdad";

const kurdishDigits = value =>
    String(value).replace(/[0-9]/g, digit =>
        "٠١٢٣٤٥٦٧٨٩"[Number(digit)]
    );

function getWeatherDescription(code) {
    const descriptions = {
        0: ["☀️", "ئاسمان ڕوون"],
        1: ["🌤️", "زۆر کەم هەور"],
        2: ["⛅", "هەور بەشێوەیی"],
        3: ["☁️", "هەوراو"],
        45: ["🌫️", "تەمی"],
        48: ["🌫️", "تەمی بەستوو"],
        51: ["🌦️", "بارانی سووک"],
        53: ["🌦️", "بارانی مامناوەند"],
        55: ["🌧️", "بارانی بەهێز"],
        56: ["🌧️", "بارانی سارد"],
        57: ["🌧️", "بارانی ساردی بەهێز"],
        61: ["🌦️", "بارانی سووک"],
        63: ["🌧️", "باران"],
        65: ["🌧️", "بارانی بەهێز"],
        66: ["🌧️", "بارانی سەهۆڵی"],
        67: ["🌧️", "بارانی سەهۆڵی بەهێز"],
        71: ["🌨️", "بەفرێکی سووک"],
        73: ["🌨️", "بەفر"],
        75: ["❄️", "بەفرێکی بەهێز"],
        77: ["❄️", "وردەبەفر"],
        80: ["🌦️", "ڕشانەوەی باران"],
        81: ["🌧️", "ڕشانەوەی باران"],
        82: ["⛈️", "ڕشانەوەی بارانی بەهێز"],
        85: ["🌨️", "ڕشانەوەی بەفر"],
        86: ["❄️", "ڕشانەوەی بەفری بەهێز"],
        95: ["⛈️", "زریان"],
        96: ["⛈️", "زریان و تەگەرە"],
        99: ["⛈️", "زریان و تەگەرەی بەهێز"]
    };

    return descriptions[code] || ["🌡️", "کەشوهەوا"];
}

async function loadWeather() {
    const status = document.getElementById("status-text");

    try {
        status.textContent = "نوێکردنەوەی داتا...";

        const response = await fetch(API_URL, {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error("Weather API unavailable");
        }

        const data = await response.json();
        const current = data.current;

        if (!current) {
            throw new Error("No current weather data");
        }

        const temperature = Math.round(current.temperature_2m);
        const humidity = Math.round(current.relative_humidity_2m);
        const wind = Math.round(current.wind_speed_10m);
        const code = current.weather_code;
        const isDay = current.is_day === 1;

        const weather = getWeatherDescription(code);
        let emoji = weather[0];

        // نیشاندانی مانگ لە شەودا بۆ دۆخی ئاسمانی ڕوون
        if (!isDay && code === 0) {
            emoji = "🌙";
        } else if (!isDay && code === 1) {
            emoji = "🌙";
        }

        document.getElementById("temp-val").textContent =
            kurdishDigits(temperature) + "°C";

        document.getElementById("weather-icon").textContent = emoji;
        document.getElementById("cond-text").textContent = weather[1];

        document.getElementById("extra-text").textContent =
            "شێ: " + kurdishDigits(humidity) +
            "٪ | با: " + kurdishDigits(wind) + " کم/ک";

        const updatedAt = new Date();
        document.getElementById("status-text").textContent =
            "نوێکراوەتەوە: " +
            kurdishDigits(
                updatedAt.toLocaleTimeString("en-GB", {
                    timeZone: "Asia/Baghdad",
                    hour: "2-digit",
                    minute: "2-digit",
                    hour12: false
                })
            );

    } catch (error) {
        status.textContent =
            "پەیوەندی بەردەست نییە؛ دووبارە هەوڵ دەدرێت";
        console.error("Weather loading error:", error);
    }
}

// بارکردنی یەکەم داتا
loadWeather();

// نوێکردنەوەی خۆکار هەر ٥ خولەک جارێک
setInterval(loadWeather, 5 * 60 * 1000);
</script>
</body>
</html>
